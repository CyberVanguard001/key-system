<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,maximum-scale=1"/>
  <link rel="icon" type="image/webp" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22bg%22%20cx%3D%2250%25%22%20cy%3D%2250%25%22%20r%3D%2250%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231a0000%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23000000%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22url%28%23bg%29%22%20stroke%3D%22%23dc2626%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2272%22%20font-family%3D%22Arial%20Black%2CArial%2Csans-serif%22%20font-size%3D%2268%22%20font-weight%3D%22900%22%20fill%3D%22%23dc2626%22%20text-anchor%3D%22middle%22%3EG%3C/text%3E%3C/svg%3E"/>
  <title>Apostilas - GORDINHO SP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --dark-bg: #0a0000;
      --card-bg: rgba(42, 0, 0, 0.4);
      --primary: #dc2626;
      --accent: #ef4444;
      --border: rgba(220, 38, 38, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at top, #2a0000 0%, #0a0000 100%) no-repeat fixed;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      background: rgba(10, 0, 0, 0.9);
      border-bottom: 1px solid var(--primary);
      display: flex;
      align-items: center;
      padding: 0 25px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .topbar-logo {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: var(--primary);
      text-transform: uppercase;
    }

    /* Container Principal */
    .container {
      max-width: 1200px;
      margin: 100px auto 40px;
      padding: 0 20px;
    }

    .header-section {
      margin-bottom: 30px;
    }

    .title {
      font-family: 'Sora', sans-serif;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 16px;
    }

    /* Barra de Pesquisa */
    .search-box {
      width: 100%;
      margin: 25px 0;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 15px 20px;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.2);
    }

    /* Grid de Anos */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .year-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .year-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      background: rgba(60, 0, 0, 0.7);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .year-card i {
      font-size: 48px;
      color: var(--primary);
      margin-bottom: 20px;
      display: block;
    }

    .year-card span {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
    }

    /* Voltar */
    .back-btn {
      display: none;
      align-items: center;
      gap: 10px;
      color: #fff;
      cursor: pointer;
      margin-bottom: 25px;
      font-weight: 600;
      width: fit-content;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--primary); }

    /* Grid de Apostilas (Invisível Inicialmente) */
    .apostilas-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .apostila-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .apostila-card h3 { font-size: 18px; color: #fff; }
    .apostila-card p { font-size: 14px; color: #aaa; }

    .btn-view {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-view:hover { opacity: 0.9; }

    @media (max-width: 600px) {
      .title { font-size: 26px; }
      .year-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-logo">GORDINHO SP</div>
  </header>

  <div class="container">
    <div class="header-section">
      <h1 class="title">Apostilas</h1>
      <p class="subtitle">Selecione o ano letivo para acessar os materiais de estudo.</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Pesquisar por ano (ex: 9 ano)...">
    </div>

    <div class="back-btn" id="backBtn" onclick="showYears()">
      <i class="fas fa-arrow-left"></i> Voltar para os Anos
    </div>

    <!-- Grade de Anos -->
    <div class="year-grid" id="yearGrid">
      <div class="year-card" onclick="loadApostilas(6)">
        <i class="fas fa-graduation-cap"></i>
        <span>6º Ano</span>
      </div>
      <div class="year-card" onclick="loadApostilas(7)">
        <i class="fas fa-graduation-cap"></i>
        <span>7º Ano</span>
      </div>
      <div class="year-card" onclick="loadApostilas(8)">
        <i class="fas fa-graduation-cap"></i>
        <span>8º Ano</span>
      </div>
      <div class="year-card" onclick="loadApostilas(9)">
        <i class="fas fa-graduation-cap"></i>
        <span>9º Ano</span>
      </div>
      <div class="year-card" onclick="loadApostilas(1)">
        <i class="fas fa-school"></i>
        <span>1ª Série EM</span>
      </div>
      <div class="year-card" onclick="loadApostilas(2)">
        <i class="fas fa-school"></i>
        <span>2ª Série EM</span>
      </div>
      <div class="year-card" onclick="loadApostilas(3)">
        <i class="fas fa-school"></i>
        <span>3ª Série EM</span>
      </div>
    </div>

    <!-- Grade de Apostilas -->
    <div class="apostilas-grid" id="apostilasGrid">
      <!-- Conteúdo dinâmico via Script -->
    </div>
  </div>

  <script>
    // Mock de dados para demonstração (Pode ser integrado com seu script externo)
    const apostilasData = [
      { id: 1, year: 9, name: "Matemática e Português", vol: "Volume 1" },
      { id: 2, year: 9, name: "História e Ciências", vol: "Volume 1" },
      { id: 3, year: 3, name: "Física e Química", vol: "Volume 2" },
      { id: 4, year: 6, name: "Geografia e Inglês", vol: "Volume 1" }
    ];

    function loadApostilas(year) {
      const yearGrid = document.getElementById('yearGrid');
      const apostilasGrid = document.getElementById('apostilasGrid');
      const backBtn = document.getElementById('backBtn');
      const searchBox = document.querySelector('.search-box');

      yearGrid.style.display = 'none';
      searchBox.style.display = 'none';
      apostilasGrid.style.display = 'grid';
      backBtn.style.display = 'flex';

      apostilasGrid.innerHTML = '';
      
      // Aqui você filtraria do seu objeto global real ALL_APOSTILAS
      const filtered = apostilasData.filter(a => a.year === year);

      if (filtered.length === 0) {
        apostilasGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">Nenhuma apostila encontrada para este ano.</p>';
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'apostila-card';
        card.innerHTML = `
          <i class="fas fa-file-pdf" style="font-size: 30px; color: #dc2626;"></i>
          <div>
            <h3>${item.name}</h3>
            <p>${item.vol}</p>
          </div>
          <button class="btn-view">Visualizar</button>
        `;
        apostilasGrid.appendChild(card);
      });
    }

    function showYears() {
      document.getElementById('yearGrid').style.display = 'grid';
      document.querySelector('.search-box').style.display = 'block';
      document.getElementById('apostilasGrid').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
    }

    // Pesquisa Simples
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('.year-card');
      
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(term) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
