<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostilas Gordinho SP</title>
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --bg-dark: #1a0000;
            --card-bg: #2a0000;
            --text-light: #ffffff;
            --text-muted: #fca5a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* 1. Cabeçalho */
        header {
            background-color: #000;
            padding: 20px 5%;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
        }

        /* 2. Seção Principal */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 3. Sistema de Pesquisa */
        .search-section {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.1);
        }

        .search-form {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-form label {
            font-weight: 600;
            color: var(--text-muted);
        }

        .search-form input {
            background: #000;
            border: 1px solid var(--primary);
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            flex-grow: 1;
            max-width: 300px;
        }

        .search-form button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-form button:hover {
            background-color: var(--primary-dark);
        }

        /* 4. Área de Exibição */
        .apostilas-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .apostila-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(220, 38, 38, 0.2);
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .apostila-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .apostila-card h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .apostila-card .year-label {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .apostila-card p {
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #d1d5db;
            flex-grow: 1;
        }

        .apostila-card a {
            display: block;
            text-align: center;
            background-color: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .apostila-card a:hover {
            background-color: var(--primary);
            color: white;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* Estilização Responsiva */
        @media screen and (max-width: 768px) {
            header h1 {
                font-size: 1.4rem;
                width: 100%;
                text-align: center;
            }
            
            .search-form {
                flex-direction: column;
                align-items: stretch;
            }

            .search-form input {
                max-width: 100%;
            }

            .apostilas-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>GORDINHO SP</h1>
    </header>

    <main>
        <section class="search-section">
            <form id="search-form" class="search-form">
                <label for="year-input">Pesquisar por Ano:</label>
                <input type="number" id="year-input" placeholder="Ex: 3" min="1">
                <button type="submit" id="search-button">Buscar</button>
            </form>
        </section>

        <div class="apostilas-container" id="apostilas-container">
            <!-- Cards serão inseridos aqui -->
        </div>
    </main>

    <script>
        // Dados reais das apostilas mapeados do projeto Gordinho Tarefas
        const mockApostilas = [
            { 
                id: 1, 
                titulo: "Português e Matemática", 
                ano: 3, 
                descricao: "Apostila completa do 3º Ano do Ensino Médio - Volume 1.", 
                link: "https://apostilas.crimsonzerohub.xyz/3_Ano/1_volume/portugues_matematica/download/portugues_matematica.pdf" 
            },
            { 
                id: 2, 
                titulo: "História, Física e Inglês", 
                ano: 3, 
                descricao: "Material de Ciências Humanas e Linguagens - 3º Ano - Volume 1.", 
                link: "https://apostilas.crimsonzerohub.xyz/3_Ano/1_volume/historia_fisica_ingles/download/historia_fisica_ingles.pdf" 
            },
            { 
                id: 3, 
                titulo: "Português e Matemática", 
                ano: 2, 
                descricao: "Material de estudo focado em competências para o 2º Ano do Ensino Médio.", 
                link: "https://apostilas.crimsonzerohub.xyz/2_Ano/1_volume/portugues_matematica/download/portugues_matematica.pdf" 
            },
            { 
                id: 4, 
                titulo: "Física, Biologia e Química", 
                ano: 2, 
                descricao: "Apostila de Ciências da Natureza para o 2º Ano - Volume 1.", 
                link: "https://apostilas.crimsonzerohub.xyz/2_Ano/1_volume/fisica_biologia_quimica/download/fisica_biologia_quimica.pdf" 
            },
            { 
                id: 5, 
                titulo: "Português e Matemática", 
                ano: 1, 
                descricao: "Início da jornada do Ensino Médio - Volume 1.", 
                link: "https://apostilas.crimsonzerohub.xyz/1_Ano/1_volume/portugues_matematica/download/portugues_matematica.pdf" 
            },
            { 
                id: 6, 
                titulo: "História, Geografia e Inglês", 
                ano: 9, 
                descricao: "Material preparatório para o Ensino Médio - 9º Ano Fundamental.", 
                link: "https://apostilas.crimsonzerohub.xyz/9_Ano/1_volume/historia_ciencias_ingles_projeto_de_vida/download/historia_ciencias_ingles_projeto_de_vida.pdf" 
            }
        ];

        function filterApostilasByYear(year) {
            if (!year) return mockApostilas;
            return mockApostilas.filter(ap => ap.ano == year);
        }

        function displayApostilas(apostilas) {
            const container = document.getElementById('apostilas-container');
            container.innerHTML = '';

            if (apostilas.length === 0) {
                container.innerHTML = '<div class="no-results">Nenhuma apostila encontrada para este ano. Tente outro (ex: 1, 2, 3 ou 9).</div>';
                return;
            }

            apostilas.forEach(ap => {
                const card = document.createElement('div');
                card.className = 'apostila-card';
                card.innerHTML = `
                    <h2>${ap.titulo}</h2>
                    <div class="year-label">Série: ${ap.ano}º Ano</div>
                    <p>${ap.descricao}</p>
                    <a href="${ap.link}" target="_blank">Baixar PDF</a>
                `;
                container.appendChild(card);
            });
        }

        // Event Listener para a pesquisa
        document.getElementById('search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const yearVal = document.getElementById('year-input').value;
            const filtered = filterApostilasByYear(yearVal);
            displayApostilas(filtered);
        });

        // Chamada inicial
        displayApostilas(mockApostilas);
    </script>
</body>
</html>
