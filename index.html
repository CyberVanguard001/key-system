  <style>
    :root{--dark-bg:#1a0000!important;--primary:#dc2626!important;--accent:#ef4444!important}
    body{background:radial-gradient(ellipse at top,#2a0000 0%,#0a0000 100%)!important;color:#fff!important;font-family:'Inter','Open Sans',sans-serif!important}
    
    /* REMOVER SIDEBAR E ELEMENTOS DE MENU */
    .sidebar, .overlay, .menu-toggle, .topbar-app-btn, .app-download, .download-app, [class*="baixar"], [class*="download-app"] {
      display: none !important;
    }
    
    /* AJUSTE DO CONTEÚDO PRINCIPAL SEM SIDEBAR */
    .main {
      margin-left: 0 !important;
      padding-top: 70px !important;
      width: 100% !important;
    }
    
    /* CABEÇALHO COM NOME À ESQUERDA */
    .topbar {
      left: 0 !important;
      width: 100% !important;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px !important;
      background: rgba(26, 0, 0, 0.95) !important;
    }
    
    .topbar-logo-text {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #dc2626;
      letter-spacing: -0.5px;
    }

    /* ESTILOS ORIGINAIS MANTIDOS */
    .gm-credit{text-align:center;padding:12px;color:#dc2626;font-size:12px;opacity:.7}
    .pdf-modal{display:none;position:fixed!important;inset:0!important;z-index:9999;background:#0a0000;flex-direction:column;height:100vh;height:100dvh;overflow:hidden!important}
    .pdf-modal.active{display:flex!important}
    .pdf-viewer{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px 8px 96px}
    .pdf-controls{position:fixed!important;left:0!important;right:0!important;bottom:0!important;display:flex!important;visibility:visible!important;opacity:1!important;align-items:center;justify-content:center;gap:12px;padding:10px 12px;background:#1a0000;border-top:1px solid #dc2626;z-index:10001!important}
    .pdf-nav-btn{background:#dc2626;color:#fff;border:none;border-radius:8px;height:40px;padding:0 14px;cursor:pointer}
    .pdf-page-input{width:56px;padding:6px 8px;border-radius:6px;border:1px solid #dc2626;background:#0a0000;color:#fff;text-align:center}
    
    @media(max-width:600px){
      .pdf-controls{left:8px!important;right:8px!important;bottom:20px!important;border-radius:14px}
    }
  </style>
</head>
<body>
<div class="main" id="main-wrap">
  <header class="topbar">
    <div class="topbar-logo-text">GORDINHO SP</div>
    <div class="topbar-right">
      <div class="topbar-user" id="topbar-user">
        <div class="topbar-avatar">U</div>
        <span class="topbar-username">Usuário</span>
      </div>
    </div>
  </header>

  <div id="spa-page-content">
    <main class="content">
      <div class="apostilas-container">
        <div class="apostilas-header">
          <h1 class="apostilas-title">
            <i class="fas fa-book-open" style="color: var(--primary);"></i>
            Apostilas
          </h1>
          <p class="apostilas-subtitle">Material de estudo disponível para o seu ano</p>
          <div class="user-year-badge" id="user-year-badge">
            <i class="fas fa-graduation-cap"></i>
            <span id="user-year-text">Detectando ano...</span>
          </div>
        </div>
        <div class="apostilas-grid" id="apostilas-grid"></div>
        <div class="empty-state" id="empty-state" style="display: none;">
          <i class="fas fa-book"></i>
          <h3>Nenhuma apostila encontrada</h3>
          <p>Não foi possível detectar seu ano ou não há apostilas disponíveis.</p>
        </div>
      </div>
    </main>

    <!-- PDF Viewer Modal -->
    <div class="pdf-modal" id="pdf-modal">
      <div class="pdf-header">
        <span class="pdf-title" id="pdf-title">Apostila</span>
        <div class="pdf-actions">
          <button class="pdf-btn" onclick="openAIModal()">
            <i class="fas fa-robot"></i> Responder com IA
          </button>
          <button class="pdf-close" onclick="closePdfViewer()">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="pdf-viewer">
        <div class="pdf-canvas-container" id="pdf-canvas-container">
          <div class="pdf-loading" id="pdf-loading">
            <div class="pdf-loading-spinner"></div>
            <span>Carregando página...</span>
          </div>
          <canvas id="pdf-canvas" style="display: none;"></canvas>
        </div>
      </div>
      <div class="pdf-controls">
        <button class="pdf-nav-btn" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="pdf-page-info">
          Página <input type="number" class="pdf-page-input" id="page-input" value="1" min="1" onchange="goToPage()"> 
          de <span id="total-pages">0</span>
        </div>
        <button class="pdf-nav-btn" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>

    <!-- AI Modal -->
    <div class="ai-modal" id="ai-modal">
      <div class="ai-content">
        <div class="ai-header">
          <span class="ai-title"><i class="fas fa-robot"></i> Resposta da IA</span>
          <button class="pdf-close" onclick="closeAIModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="ai-body" id="ai-body"></div>
      </div>
    </div>
  </div>
</div>
