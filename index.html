    body{background:radial-gradient(ellipse at top,#2a0000 0%,#0a0000 100%)!important;color:#fff!important;font-family:'Inter','Open Sans',sans-serif!important}

    }

    .main {
      margin-left: 0 !important;

      width: 100% !important;
    }
    
    /* CABEÇALHO GORDINHO SP */
    .topbar {
      left: 0 !important;
      width: 100% !important;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 0 20px !important;
      background: rgba(26, 0, 0, 0.95) !important;
      border-bottom: 1px solid var(--primary);
    }
    
    .topbar-logo-text {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #dc2626;
      letter-spacing: -0.5px;
    }

    /* SISTEMA DE PESQUISA */
    .search-section {
      margin: 20px 0;
      padding: 0 15px;
    }
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    /* CARDS DE ANOS */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .year-card {
      background: rgba(42, 0, 0, 0.4);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 15px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .year-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      background: rgba(60, 0, 0, 0.6);
    }
    .year-card i {
      font-size: 38px;
      color: var(--primary);
      margin-bottom: 12px;
      display: block;
    }
    .year-card span {
      font-weight: 700;
      font-size: 18px;
      font-family: 'Sora', sans-serif;
    }

    /* BOTÃO VOLTAR */
    .back-btn {
      display: none;
      align-items: center;
      gap: 8px;
      color: #fff;
      cursor: pointer;
      margin: 0 0 20px 15px;
      font-weight: 600;
      width: fit-content;
    }
    .back-btn:hover { color: var(--primary); }

    .gm-credit{text-align:center;padding:12px;color:#dc2626;font-size:12px;opacity:.7}
    .pdf-modal{display:none;position:fixed!important;inset:0!important;z-index:9999;background:#0a0000;flex-direction:column;height:100vh;height:100dvh;overflow:hidden!important}

    .pdf-nav-btn{background:#dc2626;color:#fff;border:none;border-radius:8px;height:40px;padding:0 14px;cursor:pointer}

<body>
<div class="main" id="main-wrap">
  <header class="topbar">
    <div class="topbar-logo-text">GORDINHO SP</div>
  </header>

  <div id="spa-page-content">
    <main class="content">
      <div class="apostilas-container">
        <div class="apostilas-header" style="padding-left: 15px;">
          <h1 class="apostilas-title" style="margin-top: 20px;">
            <i class="fas fa-book-open" style="color: var(--primary);"></i>
            Apostilas
          </h1>
          <p class="apostilas-subtitle">Material de estudo por ano letivo</p>
        </div>

        <div class="search-section">
          <input type="text" class="search-input" id="search-bar" placeholder="Pesquisar por ano ou matéria...">
        </div>

        <div class="back-btn" id="back-btn" onclick="backToYears()">
          <i class="fas fa-arrow-left"></i> Voltar
        </div>

        <div class="year-grid" id="year-grid">
          <!-- Gerado dinamicamente -->
        </div>

        <div class="apostilas-grid" id="apostilas-grid" style="display: none; padding: 15px;">
          <!-- Apostilas do ano filtrado -->
        </div>

        <div class="empty-state" id="empty-state" style="display: none; text-align: center; margin-top: 40px;">
          <i class="fas fa-search" style="font-size: 40px; color: #555;"></i>
          <h3 style="margin-top: 15px;">Nenhum resultado encontrado</h3>
        </div>
      </div>
    </main>

    <!-- PDF Viewer Modal -->
    <div class="pdf-modal" id="pdf-modal">
      <div class="pdf-header">
        <span class="pdf-title" id="pdf-title">Apostila</span>
        <div class="pdf-actions">
          <button class="pdf-btn" onclick="openAIModal()"><i class="fas fa-robot"></i> Responder IA</button>
          <button class="pdf-close" onclick="closePdfViewer()"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="pdf-viewer">
        <div class="pdf-canvas-container" id="pdf-canvas-container">
          <div class="pdf-loading" id="pdf-loading">
            <div class="pdf-loading-spinner"></div>
            <span>Carregando...</span>
          </div>
          <canvas id="pdf-canvas" style="display: none;"></canvas>
        </div>
      </div>
      <div class="pdf-controls">
        <button class="pdf-nav-btn" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="pdf-page-info">
          Pág <input type="number" class="pdf-page-input" id="page-input" value="1" min="1" onchange="goToPage()"> de <span id="total-pages">0</span>
        </div>
        <button class="pdf-nav-btn" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    
    <div class="ai-modal" id="ai-modal">
      <div class="ai-content">
        <div class="ai-header">
          <span class="ai-title"><i class="fas fa-robot"></i> Resposta da IA</span>
          <button class="pdf-close" onclick="closeAIModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="ai-body" id="ai-body"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://crimsonzerohub.xyz/main/apostilas.js?v=15"></script>
<script src="https://crimsonzerohub.xyz/main/dashboard.js?v=2"></script>

<script>
  const years = [
    { id: 6, name: "6º Ano" },
    { id: 7, name: "7º Ano" },
    { id: 8, name: "8º Ano" },
    { id: 9, name: "9º Ano" },
    { id: 1, name: "1ª Série EM" },
    { id: 2, name: "2ª Série EM" },
    { id: 3, name: "3ª Série EM" }
  ];

  function renderYears(filter = "") {
    const grid = document.getElementById('year-grid');
    grid.innerHTML = '';
    const filtered = years.filter(y => y.name.toLowerCase().includes(filter.toLowerCase()));
    
    filtered.forEach(y => {
      const card = document.createElement('div');
      card.className = 'year-card';
      card.innerHTML = `<i class="fas fa-graduation-cap"></i><span>${y.name}</span>`;
      card.onclick = () => loadYear(y.id);
      grid.appendChild(card);
    });

    document.getElementById('empty-state').style.display = filtered.length === 0 ? 'block' : 'none';
  }

  function loadYear(yearId) {
    document.getElementById('year-grid').style.display = 'none';
    document.getElementById('back-btn').style.display = 'flex';
    const grid = document.getElementById('apostilas-grid');
    grid.style.display = 'grid';
    grid.innerHTML = '';

    if (typeof ALL_APOSTILAS === 'undefined') return;

    const filtered = Object.entries(ALL_APOSTILAS).filter(([id, data]) => data.year == yearId);

    filtered.forEach(([id, data]) => {
      const card = document.createElement('div');
      card.className = 'apostila-card';
      card.innerHTML = `
        <div class="apostila-info">
          <h3 style="font-size: 16px; margin-bottom: 5px;">${data.name}</h3>
          <p style="font-size: 13px; color: #aaa;">Vol: ${data.volume}</p>
        </div>
        <button class="btn-view" onclick="openApostila('${id}')" style="background:var(--primary); color:#fff; border:none; border-radius:8px; padding:10px; margin-top:10px; cursor:pointer; font-weight:bold;">Visualizar</button>
      `;
      grid.appendChild(card);
    });
  }

  function backToYears() {
    document.getElementById('year-grid').style.display = 'grid';
    document.getElementById('apostilas-grid').style.display = 'none';
    document.getElementById('back-btn').style.display = 'none';
    renderYears();
  }

  document.getElementById('search-bar').addEventListener('input', (e) => {
    if (document.getElementById('year-grid').style.display !== 'none') {
      renderYears(e.target.value);
    }
  });

  window.onload = () => renderYears();
  
  // Mock para evitar erros do script original
  window.toggleSidebar = () => {};
  window.closeSidebar = () => {};
</script>
