<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Apostilas - GORDINHO SP</title>
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --bg-dark: #0a0000;
            --card-bg: #1a0000;
            --card-border: #330000;
            --text-light: #ffffff;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background: #000;
            padding: 1.5rem 5%;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { color: var(--primary); font-size: 1.5rem; font-weight: 900; }

        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .search-area {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--card-border);
            margin-bottom: 3rem;
            text-align: center;
        }

        .search-form { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }

        input {
            padding: 0.8rem 1.2rem;
            border-radius: 0.5rem;
            border: 1px solid var(--card-border);
            background: #000;
            color: #fff;
            width: 100%;
            max-width: 300px;
        }

        button {
            padding: 0.8rem 2rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary);
            padding-left: 1rem;
            margin-top: 2rem;
        }

        .apostilas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .apostila-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .apostila-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: rgba(220, 38, 38, 0.1);
            color: var(--primary);
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
            width: fit-content;
        }

        .description { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; flex-grow: 1; }

        .btn-view {
            text-align: center;
            cursor: pointer;
            background: transparent;
            color: #fff;
            border: 1px solid var(--primary);
            padding: 0.6rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-view:hover { background: var(--primary); }

        /* Modal do Visualizador */
        #viewer-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
        }

        #viewer-modal.active { display: flex; }

        .viewer-header {
            background: #111;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--primary);
        }

        .close-viewer {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: bold;
        }

        #pdf-frame { width: 100%; height: 100%; border: none; }

        @media (max-width: 768px) {
            .search-form { flex-direction: column; align-items: center; }
            input { max-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>GORDINHO SP</h1>
        <div style="font-size: 0.8rem; opacity: 0.5;">Visualizador de Apostilas</div>
    </header>

    <main>
        <section class="search-area">
            <h2>Qual o seu ano escolar?</h2>
            <form id="search-form" class="search-form">
                <input type="number" id="year-input" placeholder="Ex: 3" min="1" max="9">
                <button type="submit">Visualizar Apostilas</button>
            </form>
        </section>

        <div id="content-area"></div>
    </main>

    <!-- Visualizador Modal -->
    <div id="viewer-modal">
        <div class="viewer-header">
            <span id="viewer-title">Visualizando Apostila</span>
            <button class="close-viewer" onclick="closeViewer()">Fechar</button>
        </div>
        <iframe id="pdf-frame"></iframe>
    </div>

    <script>
        const BASE_URL = "https://apostilas.crimsonzerohub.xyz";
        
        const todasApostilas = [
            // 3º ANO MÉDIO
            { id: '3v1_pm', titulo: "Português e Matemática", ano: 3, vol: 1, path: "/3_Ano/1_volume/portugues_matematica" },
            { id: '3v1_hfi', titulo: "História, Física e Inglês", ano: 3, vol: 1, path: "/3_Ano/1_volume/historia_fisica_ingles" },
            { id: '3v2_pm', titulo: "Português e Matemática", ano: 3, vol: 2, path: "/3_Ano/2_volume/portugues_matematica" },
            { id: '3v2_hfi', titulo: "História, Física e Inglês", ano: 3, vol: 2, path: "/3_Ano/2_volume/historia_fisica_ingles" },

            // 2º ANO MÉDIO
            { id: '2v1_pm', titulo: "Português e Matemática", ano: 2, vol: 1, path: "/2_Ano/1_volume/portugues_matematica" },
            { id: '2v1_hgi', titulo: "História, Geografia e Inglês", ano: 2, vol: 1, path: "/2_Ano/1_volume/historia_fisica_ingles" },
            { id: '2v1_fbq', titulo: "Física, Biologia e Química", ano: 2, vol: 1, path: "/2_Ano/1_volume/fisica_biologia_quimica" },
            { id: '2v2_pm', titulo: "Português e Matemática", ano: 2, vol: 2, path: "/2_Ano/2_volume/portugues_matematica" },
            { id: '2v2_hcg', titulo: "História, Ciências, Geografia e Inglês", ano: 2, vol: 2, path: "/2_Ano/2_volume/historia_ciencias_geografia_ingles" },

            // 1º ANO MÉDIO
            { id: '1v1_pm', titulo: "Português e Matemática", ano: 1, vol: 1, path: "/1_Ano/1_volume/portugues_matematica" },
            { id: '1v1_fbq', titulo: "Física, Biologia e Química", ano: 1, vol: 1, path: "/1_Ano/1_volume/fisica_biologia_quimica" },
            { id: '1v1_hgi', titulo: "História, Geografia e Inglês", ano: 1, vol: 1, path: "/1_Ano/1_volume/historia_fisica_ingles" },

            // SÃO PAULO EM AÇÃO (Exemplo 3º ano)
            { id: 'spa_mat_3', titulo: "SP em Ação — Matemática", ano: 3, vol: "Único", path: "/SAO-PAULO-EM-ACAO/livro_1/SAO-PAULO-EM-ACAO-MATEMATICA" },
            { id: 'spa_por_3', titulo: "SP em Ação — Português", ano: 3, vol: "Único", path: "/SAO-PAULO-EM-ACAO/livro_1/SAO-PAULO-EM-ACAO-PORTUGUES" },

            // FUNDAMENTAL 6º AO 9º
            { id: '9v1_pm', titulo: "Português e Matemática", ano: 9, vol: 1, path: "/9_Ano/1_volume/portugues_matematica" },
            { id: '8v1_pm', titulo: "Português e Matemática", ano: 8, vol: 1, path: "/8_Ano/1_volume/portugues_matematica" },
            { id: '7v1_pm', titulo: "Português e Matemática", ano: 7, vol: 1, path: "/7_Ano/1_volume/portugues_matematica" },
            { id: '6v1_pm', titulo: "Português e Matemática", ano: 6, vol: 1, path: "/6_Ano/1_volume/portugues_matematica" }
        ];

        function openViewer(title, path) {
            const folder = path.split('/').pop();
            const url = `${BASE_URL}${path}/download/${folder}.pdf`;
            document.getElementById('viewer-title').textContent = title;
            document.getElementById('pdf-frame').src = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
            document.getElementById('viewer-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeViewer() {
            document.getElementById('viewer-modal').classList.remove('active');
            document.getElementById('pdf-frame').src = '';
            document.body.style.overflow = 'auto';
        }

        function renderizar(filtroAno = null) {
            const container = document.getElementById('content-area');
            container.innerHTML = '';
            const anosUnicos = [...new Set(todasApostilas.map(a => a.ano))].sort((a, b) => b - a);
            const anosParaMostrar = filtroAno ? [parseInt(filtroAno)] : anosUnicos;

            anosParaMostrar.forEach(ano => {
                const apostilasDoAno = todasApostilas.filter(a => a.ano === ano);
                if (apostilasDoAno.length === 0) return;

                const label = ano <= 3 ? `${ano}º Ano - Médio` : `${ano}º Ano - Fundamental`;
                let html = `<h2 class="section-title">${label}</h2><div class="apostilas-grid">`;
                
                apostilasDoAno.forEach(ap => {
                    html += `
                        <div class="apostila-card">
                            <span class="badge">Volume ${ap.vol}</span>
                            <h3>${ap.titulo}</h3>
                            <p class="description">Material digital oficial do estado de SP.</p>
                            <button class="btn-view" onclick="openViewer('${ap.titulo}', '${ap.path}')">Visualizar Apostila</button>
                        </div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            renderizar(document.getElementById('year-input').value);
        });

        renderizar();
    </script>
</body>
</html>
