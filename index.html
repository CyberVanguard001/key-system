<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,maximum-scale=1"/>
  <link rel="icon" type="image/webp" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22bg%22%20cx%3D%2250%25%22%20cy%3D%2250%25%22%20r%3D%2250%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231a0000%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23000000%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22url%28%23bg%29%22%20stroke%3D%22%23dc2626%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2272%22%20font-family%3D%22Arial%20Black%2CArial%2Csans-serif%22%20font-size%3D%2268%22%20font-weight%3D%22900%22%20fill%3D%22%23dc2626%22%20text-anchor%3D%22middle%22%3EG%3C/text%3E%3C/svg%3E"/>
  <title>Apostilas - GORDINHO SP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet"/>
  
  <style>
    :root {
      --dark-bg: #1a0000;
      --primary: #dc2626;
      --accent: #ef4444;
      --card-bg: rgba(42, 0, 0, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at top, #2a0000 0%, #0a0000 100%) no-repeat fixed;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
    }

    /* Cabeçalho */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(26, 0, 0, 0.95);
      border-bottom: 1px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .topbar-logo-text {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-avatar {
      width: 35px;
      height: 35px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Conteúdo Principal */
    .main-content {
      padding: 100px 20px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .apostilas-header {
      margin-bottom: 30px;
      text-align: left;
    }

    .apostilas-title {
      font-family: 'Sora', sans-serif;
      font-size: 28px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .apostilas-subtitle {
      color: #ccc;
      font-size: 16px;
    }

    /* Grid de Apostilas */
    .apostilas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .apostila-card {
      background: var(--card-bg);
      border: 1px solid rgba(220, 38, 38, 0.3);
      border-radius: 15px;
      padding: 20px;
      transition: transform 0.3s, border-color 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .apostila-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      background: rgba(60, 0, 0, 0.8);
    }

    .card-icon {
      font-size: 40px;
      color: var(--primary);
    }

    .card-info h3 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .card-info p {
      font-size: 14px;
      color: #aaa;
    }

    .btn-view {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      width: 100%;
    }

    /* Modal PDF */
    .pdf-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      flex-direction: column;
    }

    .pdf-modal.active { display: flex; }

    .pdf-header {
      height: 60px;
      background: var(--dark-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--primary);
    }

    .pdf-close {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .pdf-frame {
      flex: 1;
      width: 100%;
      border: none;
    }

    @media (max-width: 600px) {
      .topbar { padding: 0 15px; }
      .topbar-logo-text { font-size: 18px; }
      .apostilas-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-logo-text">GORDINHO SP</div>
    <div class="topbar-user">
      <div class="topbar-avatar">G</div>
      <span class="topbar-username">Estudante</span>
    </div>
  </header>

  <main class="main-content">
    <div class="apostilas-header">
      <h1 class="apostilas-title">
        <i class="fas fa-book-open"></i> Apostilas
      </h1>
      <p class="apostilas-subtitle">Material oficial de estudo</p>
    </div>

    <div class="apostilas-grid" id="grid">
      <!-- Exemplo de Card -->
      <div class="apostila-card" onclick="openPdf('Matemática - 1º Ano', 'https://crimsonzerohub.xyz/pdf/exemplo.pdf')">
        <div class="card-icon"><i class="fas fa-file-pdf"></i></div>
        <div class="card-info">
          <h3>Matemática</h3>
          <p>1º Ano - Volume 1</p>
        </div>
        <button class="btn-view">Visualizar</button>
      </div>
      
      <div class="apostila-card" onclick="openPdf('Português - 2º Ano', 'https://crimsonzerohub.xyz/pdf/exemplo2.pdf')">
        <div class="card-icon"><i class="fas fa-file-pdf"></i></div>
        <div class="card-info">
          <h3>Português</h3>
          <p>2º Ano - Volume 1</p>
        </div>
        <button class="btn-view">Visualizar</button>
      </div>
    </div>
  </main>

  <!-- Visualizador Simples -->
  <div class="pdf-modal" id="modal">
    <div class="pdf-header">
      <span id="pdf-title">Título da Apostila</span>
      <button class="pdf-close" onclick="closePdf()">&times;</button>
    </div>
    <iframe class="pdf-frame" id="pdf-frame"></iframe>
  </div>

  <script>
    function openPdf(title, url) {
      document.getElementById('pdf-title').innerText = title;
      // Usando o visualizador do Google para garantir compatibilidade
      document.getElementById('pdf-frame').src = 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
      document.getElementById('modal').classList.add('active');
    }

    function closePdf() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('pdf-frame').src = '';
    }
  </script>
</body>
</html>
